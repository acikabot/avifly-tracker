{% if job.status == "done" %}<span class="badge text-bg-success">{{ job.get_status_display }}</span>{% elif job.status == "in_progress" %}<span class="badge text-bg-warning">{{ job.get_status_display }}</span>{% elif job.status == "cancelled" %}<span class="badge text-bg-secondary">{{ job.get_status_display }}</span>{% else %}<span class="badge text-bg-info">{{ job.get_status_display }}</span>{% endif %}{% if job.length_label %} <span class="badge text-bg-light border">{{ job.length_label }}</span>{% endif %}
